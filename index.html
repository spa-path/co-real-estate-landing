<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Colorado Real Estate Investment Dashboard</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('colorado-flag.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .content-box {
      background: rgba(255, 255, 255, 0.88);
      padding: 40px;
      margin-right: 6%;
      border-radius: 12px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 15px;
      color: #222;
    }

    p {
      font-size: 1rem;
      color: #444;
      margin-bottom: 25px;
    }

    a.button {
      display: inline-block;
      padding: 12px 28px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      font-size: 1rem;
      border-radius: 6px;
      transition: background-color 0.2s;
    }

    a.button:hover {
      background-color: #0056b3;
    }

    @media (max-width: 768px) {
      body {
        justify-content: center;
        padding: 20px;
      }
      .content-box {
        margin-right: 0;
        padding: 25px;
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="content-box">
    <h1>Colorado Real Estate Investment Dashboard</h1>
    <p>
      Explore rental investment opportunities across the Colorado Springs area.  
      Analyze income, appreciation, and cash-on-cash returns by ZIP code,  
      all backed by public Zillow data and customizable assumptions.
    </p>
    <a href="https://co-real-estate.onrender.com" class="button">Enter</a>
  </div>
</body>
</html>
