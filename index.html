<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Colorado Real Estate Dashboard</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="shortcut icon" href="heuericon.ico" type="image/x-icon" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('colorado-flag.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.15));
      z-index: 0;
    }

    .content-box {
      background: rgba(255, 255, 255, 0.88);
      padding: 40px;
      margin-right: 6%;
      border-radius: 12px;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1s ease-out forwards;
      z-index: 1;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 15px;
      color: #222;
    }

    p {
      font-size: 1rem;
      color: #444;
      margin-bottom: 25px;
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .role-button {
      padding: 12px 24px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      font-size: 1rem;
      border-radius: 6px;
      transition: all 0.2s ease;
      transform: scale(1);
    }

    .role-button:hover {
      background-color: #0056b3;
      transform: scale(1.05);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    footer {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      font-size: 0.85rem;
      color: #ddd;
      z-index: 1;
    }

    @media (max-width: 768px) {
      body {
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .content-box {
        margin-right: 0;
        padding: 25px;
        max-width: 90%;
      }
      .button-group {
        flex-direction: column;
        gap: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="content-box">
    <h1>Colorado Real Estate Dashboard</h1>
    <p>
      Choose your experience below to explore home values, rental returns, and appreciation trends in the Colorado Springs area.
    </p>
    <div class="button-group">
      <a href="https://co-real-estate.onrender.com?role=investor"
         class="role-button"
         aria-label="Enter as Investor">Investor</a>
      <a href="https://co-real-estate.onrender.com?role=homebuyer"
         class="role-button"
         aria-label="Enter as Home Buyer">Home Buyer</a>
    </div>
  </div>

  <footer>© 2025 HeuerHomes. All rights reserved.</footer>
</body>
</html>
